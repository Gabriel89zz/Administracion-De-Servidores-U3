# ==============================================================================
# /etc/cups/cupsd.conf - Configuración del Servidor de Impresión CUPS
# Unidad 3: Servidor de Impresión en Red con Colas de Prioridad
# ==============================================================================

# Nivel de log para auditoría
LogLevel warn
MaxLogSize 1000000

# Escuchar en todas las interfaces de red TCP/IP en el puerto estándar 631
Port 631
Listen /run/cups/cups.sock

# Publicación y descubrimiento de impresoras en la red local
Browsing On
BrowseLocalProtocols dnssd

# Autenticación predeterminada
DefaultAuthType Basic

# Acceso general al servidor desde la red local
<Location />
  Order allow,deny
  Allow all
</Location>

# Panel de administración web de CUPS (http://<IP>:631/admin)
<Location /admin>
  Order allow,deny
  Allow all
  Require user @SYSTEM
</Location>

# Gestión de archivos de configuración
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

# Control de directivas de colas de impresión y cancelación de trabajos
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
    Allow all
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
    Allow all
  </Limit>
</Policy>
