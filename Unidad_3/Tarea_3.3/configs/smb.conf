# ==============================================================================
# /etc/samba/smb.conf - Configuración del Servidor NAS Departamental
# Unidad 3: Almacenamiento Redundante RAID y Recursos Compartidos
# ==============================================================================

[global]
   workgroup = WORKGROUP
   server string = Servidor Debian NAS Unidad 3
   server role = standalone server
   security = user
   map to guest = Bad User
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

# ------------------------------------------------------------------------------
# Recurso Compartido 1: Repositorio Redundante sobre RAID
# Montado directamente sobre /mnt/almacen_redundante/repositorio_compartido
# ------------------------------------------------------------------------------
[AlmacenRAID]
   comment = Unidad de Red Redundante con Tolerancia a Fallos (RAID)
   path = /mnt/almacen_redundante/repositorio_compartido
   browseable = yes
   read only = no
   guest ok = no
   valid users = @sistemas @finanzas @operaciones @direccion
   create mask = 0775
   directory mask = 0775
   force group = sistemas

# ------------------------------------------------------------------------------
# Recurso Compartido 2: Zona Pública de Intercambio
# ------------------------------------------------------------------------------
[Publico]
   comment = Directorio Publico de Transferencia Temporal
   path = /srv/compartido/publico
   browseable = yes
   read only = no
   guest ok = yes
   create mask = 1777
   directory mask = 1777
